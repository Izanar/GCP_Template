name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint shellcheck-py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Set up Terragrunt
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            https://github.com/gruntwork-io/terragrunt/releases/download/v0.68.2/terragrunt_linux_amd64 \
            -o "$HOME/.local/bin/terragrunt"
          chmod +x "$HOME/.local/bin/terragrunt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Terraform formatting
        run: terraform fmt -check -recursive src

      - name: Terraform validation
        run: |
          for d in src/*/; do
            echo "==> $d"
            (cd "$d" && terraform init -backend=false -input=false -no-color && terraform validate -no-color) || exit 1
          done

      - name: Ansible syntax and lint
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: |
          ansible-playbook --syntax-check -i localhost, ansible/playbooks/gce.yml
          ansible-playbook --syntax-check ansible/playbooks/gke-deploy.yml
          ansible-playbook --syntax-check ansible/playbooks/gke-gcs-deploy.yml
          ansible-lint ansible/

      - name: YAML and Kubernetes manifest lint
        run: yamllint kubernetes/ .github/workflows/ docs/

      - name: Free regression tests
        run: python -m unittest discover -s tests -v

      - name: Shell scripts lint
        run: shellcheck scripts/*.sh
