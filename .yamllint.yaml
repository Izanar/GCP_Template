---
extends: default
rules:
  line-length:
    max: 120
    level: warning
  braces:
    max-spaces-inside: 1
    level: error
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on", "off"]
  indentation:
    spaces: 2
    indent-sequences: consistent
  hyphens:
    level: warning
