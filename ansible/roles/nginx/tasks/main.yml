---
- name: Install nginx and required packages
  ansible.builtin.apt:
    name:
      - nginx
      - curl
      - ca-certificates
      - git
    state: present
    update_cache: true

- name: Ensure web root directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Remove previous app content from web root
  ansible.builtin.shell: rm -rf "{{ app_dir }}"/* "{{ app_dir }}/.[!.]*" "{{ app_dir }}/..?*" 2>/dev/null || true
  args:
    executable: /bin/bash
  changed_when: false

- name: Clone application source
  ansible.builtin.git:
    repo: "{{ app_repo_url }}"
    dest: "{{ app_cache_dir }}"
    clone: true
    update: true
    depth: 1

- name: Copy static app files into nginx root
  ansible.builtin.copy:
    src: "{{ app_cache_dir }}/html/"
    dest: "{{ app_dir }}/"
    owner: www-data
    group: www-data
    mode: preserve
    remote_src: true

- name: Remove application checkout cache
  ansible.builtin.file:
    path: "{{ app_cache_dir }}"
    state: absent

- name: Ensure nginx is enabled and restarted
  ansible.builtin.service:
    name: nginx
    state: restarted
    enabled: true

- name: Validate nginx is serving content
  ansible.builtin.uri:
    url: "http://127.0.0.1"
    return_content: true
    timeout: 30
  register: nginx_check

- name: Fail if the page is empty
  ansible.builtin.fail:
    msg: "nginx homepage is empty or unavailable"
  when: >-
    nginx_check.status is not defined
    or nginx_check.status != 200
    or 'html' not in (nginx_check.content | default('') | lower)
