apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-nginx-app
  namespace: ai-nginx-demo
  labels:
    app: ai-nginx-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-nginx-app
  template:
    metadata:
      labels:
        app: ai-nginx-app
    spec:
      containers:
        - name: ai-nginx-app
          image: ghcr.io/izanar/gcp-template-kubernetes:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
