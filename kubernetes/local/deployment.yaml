apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-nginx-app
  namespace: ai-nginx-demo
  labels:
    app: ai-nginx-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-nginx-app
  template:
    metadata:
      labels:
        app: ai-nginx-app
    spec:
      containers:
        - name: ai-nginx-app
          image: nginx:1.27.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: app-content
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        # The AI_Nginx repository is cloned to /opt/ai-nginx by deploy.sh
        # before these manifests are applied; hostPath serves its html/ tree.
        - name: app-content
          hostPath:
            path: /opt/ai-nginx/html
            type: Directory
